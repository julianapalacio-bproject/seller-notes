<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('tema') || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <title>Seller Notes</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='swiss.css') }}">
</head>
<body class="{% block body_class %}{% endblock %} swiss">
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="34" height="34">
        <span><span class="brand-name">Seller Notes</span><span class="brand-sub">The Blue Project · Amazon.es</span></span>
      </a>
      <div class="top-right">
      <nav>
        <a href="{{ url_for('home') }}" class="{{ 'on' if page == 'dashboard' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
        <a href="{{ url_for('listings') }}" class="{{ 'on' if page == 'listings' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Listings</a>
        <a href="{{ url_for('buybox') }}" class="{{ 'on' if page == 'buybox' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análisis Productos</a>
        <a href="{{ url_for('rentabilidad') }}" class="{{ 'on' if page == 'rentabilidad' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Profit</a>
        <a href="{{ url_for('catalogos') }}" class="{{ 'on' if page == 'catalogos' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/></svg>Catálogos</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar entre modo claro y oscuro"><span class="tt-light">Claro</span><span class="tt-dark">Oscuro</span></button>
      </div>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap foot">Seller Notes · The Blue Project</footer>
  <script>
    // En el móvil el menú se desliza: difumina el borde por donde quedan opciones y deja a la vista la página actual
    {
      const nav = document.querySelector('.top nav');
      const edges = () => {
        nav.classList.toggle('more-left', nav.scrollLeft > 2);
        nav.classList.toggle('more-right', nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2);
      };
      nav.querySelector('a.on')?.scrollIntoView({ block: 'nearest', inline: 'center' });
      nav.addEventListener('scroll', edges, { passive: true });
      addEventListener('resize', edges);
      edges();
    }
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const tema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('tema', tema); } catch (e) {}
      location.reload();  // los gráficos toman los colores del modo al cargarse
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
