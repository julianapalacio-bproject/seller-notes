<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('tema') || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <title>Seller Notes</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='sobrio.css') }}">
</head>
<body class="{% block body_class %}{% endblock %} sobrio">
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="34" height="34">
        <span><span class="brand-name">Seller Notes</span><span class="brand-sub">The Blue Project · Amazon.es</span></span>
      </a>
      <div class="top-right">
      <nav>
        <a href="{{ url_for('home') }}" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
        <a href="{{ url_for('listings') }}" class="{{ 'on' if page == 'listings' }}">Listings</a>
        <a href="{{ url_for('buybox') }}" class="{{ 'on' if page == 'buybox' }}">Análisis Productos</a>
        <a href="{{ url_for('rentabilidad') }}" class="{{ 'on' if page == 'rentabilidad' }}">Profit</a>
        <a href="{{ url_for('catalogos') }}" class="{{ 'on' if page == 'catalogos' }}">Catálogos</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar entre modo claro y oscuro">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      </div>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap foot">Seller Notes · The Blue Project</footer>
  <script>
    // En el móvil el menú se desliza: difumina el borde por donde quedan opciones y deja a la vista la página actual
    {
      const nav = document.querySelector('.top nav');
      const edges = () => {
        nav.classList.toggle('more-left', nav.scrollLeft > 2);
        nav.classList.toggle('more-right', nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2);
      };
      nav.querySelector('a.on')?.scrollIntoView({ block: 'nearest', inline: 'center' });
      nav.addEventListener('scroll', edges, { passive: true });
      addEventListener('resize', edges);
      edges();
    }
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const tema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('tema', tema); } catch (e) {}
      location.reload();  // los gráficos toman los colores del modo al cargarse
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
