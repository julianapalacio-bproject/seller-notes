# Versión para probar en tu iPhone con un Apple ID gratis: sin widget ni grupo de app (Apple no los permite gratis).
# Se genera con:  cd ios && xcodegen --spec project-gratis.yml
name: SellerNotesGratis
options:
  bundleIdPrefix: com.theblueproject
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: es
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WGJFL2K6WN
targets:
  SellerNotes:
    type: application
    platform: iOS
    sources:
      - SellerNotes
      - Compartido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theblueproject.sellernotes
        PRODUCT_NAME: Seller Notes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Seller Notes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Para abrir Seller Notes con Face ID."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
